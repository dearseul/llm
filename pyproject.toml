[project]
name = "001-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

# 1. 파이썬 범위를 현재 사용 중인 3.12 버전으로 제한 (충돌 해결의 핵심)
requires-python = ">=3.12,<3.13"

dependencies = [
    "faiss-cpu>=1.8.0",
    "gensim>=4.3.0",
    "gradio>=4.0.0",
    "gradio-pdf>=0.0.20",
    "ipykernel>=6.0.0",
    "kiwipiepy>=0.17.0",
    # 2. 랭체인 버전을 안정적인 0.3대 이상으로 조정 (1.x는 아직 생태계 혼선이 있음)
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-chroma>=0.1.0",
    "langchain-google-genai>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-pinecone>=0.2.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "sentence-transformers>=3.0.0",
    # 3. torch와 transformers를 현재 안정화된 최신 버전으로 하향 조정
    "torch>=2.2.0",
    "transformers>=4.40.0",
]

[tool.uv.workspace]
members = [
    "002_etfbot",
]
